
name: Build LA-2A VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: la2a-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Show toolchain versions
        shell: pwsh
        run: |
          cmake --version
          git --version
          cl 2>&1 | Select-Object -First 3

      - name: Validate required project inputs
        shell: pwsh
        run: |
          $required = @(
            "CMakeLists.txt",
            "Source/PluginProcessor.cpp",
            "Source/PluginEditor.cpp",
            "Models/preset.NAM",
            "Tests/NamModelSmokeTest.cpp"
          )
          foreach ($file in $required) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              Write-Error "Required project file is missing: $file"
              exit 1
            }
          }
          $model = Get-Content -LiteralPath "Models/preset.NAM" -Raw | ConvertFrom-Json
          if ($model.architecture -ne "WaveNet") {
            Write-Error "Unexpected NAM architecture: $($model.architecture)"
            exit 1
          }
          if ($model.sample_rate -ne 48000) {
            Write-Error "Unexpected NAM sample rate: $($model.sample_rate)"
            exit 1
          }
          if (-not $model.weights -or $model.weights.Count -lt 1) {
            Write-Error "NAM model contains no weights."
            exit 1
          }

      - name: Configure project
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }
          cmake -S . -B build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DFETCHCONTENT_QUIET=OFF
          if ($LASTEXITCODE -ne 0) {
            Write-Error "CMake configure failed."
            exit $LASTEXITCODE
          }

      - name: Build VST3, Standalone and NAM test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 |
            Tee-Object -FilePath build-output.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "---- Compiler errors and nearby context ----"
            Select-String -Path build-output.log `
              -Pattern "error C[0-9]+|fatal error|CMake Error|FAILED:" `
              -Context 3,3
            exit 1
          }

      - name: Verify WaveNet parser registration and NAM audio processing
        shell: pwsh
        run: |
          $test = "build/Release/nam_model_smoke_test.exe"
          if (-not (Test-Path -LiteralPath $test -PathType Leaf)) {
            Write-Error "NAM smoke-test executable was not produced."
            exit 1
          }
          & $test "Models/preset.NAM"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "NAM model load/process verification failed."
            exit $LASTEXITCODE
          }

      - name: Collect artifacts
        if: success()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $plugins = Get-ChildItem build -Recurse -Directory `
            -Filter "*.vst3" -ErrorAction SilentlyContinue
          foreach ($plugin in $plugins) {
            Copy-Item $plugin.FullName `
              (Join-Path "artifacts" $plugin.Name) -Recurse -Force
          }
          $standalone = Get-ChildItem build -Recurse -File `
            -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "Standalone" }
          foreach ($exe in $standalone) {
            Copy-Item $exe.FullName "artifacts" -Force
          }
          New-Item -ItemType Directory -Force -Path artifacts/Models | Out-Null
          Copy-Item Models/preset.NAM artifacts/Models/preset.NAM -Force
          if (-not (Get-ChildItem artifacts -Force | Select-Object -First 1)) {
            Write-Error "No plugin or Standalone artifact was collected."
            exit 1
          }

      - name: Upload Windows plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LA2A-Windows-VST3
          path: artifacts/**
          if-no-files-found: error
          retention-days: 14

      - name: Print build diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build) {
            Get-ChildItem build -Recurse -File `
              -Include CMakeError.log,CMakeOutput.log,*.log |
              Select-Object -First 100 -ExpandProperty FullName
          }
          if (Test-Path build-output.log) {
            Write-Host "---- First compiler/configuration errors ----"
            Select-String -Path build-output.log `
              -Pattern "error C[0-9]+|fatal error|CMake Error|FAILED:" `
              -Context 3,3
          }
